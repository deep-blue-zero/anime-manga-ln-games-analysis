name: Bulk merge analysis branches

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview candidates or integrate eligible branches
        type: choice
        options:
          - preview
          - apply
        default: preview
      branch:
        description: Optional exact series/study branch; empty selects all
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: read

concurrency:
  group: nightly-analytical-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'deep-blue-zero/anime-manga-ln-games-analysis' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'deep-blue-zero'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Acquire the merge script from main
        shell: bash
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${CONTROLLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${CONTROLLER_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
      - name: Merge audited analysis branches
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SELECTED_BRANCH: ${{ inputs.branch }}
          READ_TOKEN: ${{ github.token }}
          OWNER_TOKEN: ${{ secrets.NIGHTLY_INTEGRATION_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python tools/nightly_integration.py --candidates analysis-branches --mode "${REQUESTED_MODE}" --branch "${SELECTED_BRANCH}"
