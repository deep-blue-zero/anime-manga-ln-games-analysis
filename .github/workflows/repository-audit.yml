name: Repository audit

on:
  push:
    branches:
      - main
      - character-registry
      - "codex/**"
      - "chatgpt/**"
      - "series/**"
      - "studies/**"
  repository_dispatch:
    types:
      - audit-generated-commit
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only integrity and publication audit
    outputs:
      integration_state: ${{ steps.validate.outputs.integration_state }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_sha || github.sha }}
      AUDIT_EVENT: ${{ github.event_name }}
      AUDIT_BRANCH: ${{ github.ref_name }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AUDIT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${AUDIT_COMMIT}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${AUDIT_COMMIT}"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Install hash-locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r tools/requirements-validation.txt

      - name: Validate authored content or the exact integration commit
        id: validate
        shell: bash
        env:
          MANGA_ANIME_TEST_TMP: "${{ runner.temp }}/manga-anime-tests"
        run: |
          set -euo pipefail
          audit_args=(--phase current --snapshot commit --commit "${AUDIT_COMMIT}" --repo . --result-json "${RUNNER_TEMP}/audit-result.json")
          if [[ "${AUDIT_EVENT}" = "push" && "${AUDIT_BRANCH}" =~ ^(series|studies)/[a-z0-9][a-z0-9-]*$ ]]; then
            audit_args+=(--routing-preflight "${AUDIT_BRANCH}")
          fi
          python tools/validate_repository.py "${audit_args[@]}"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          policy_path = Path("governance/repository-controls/tracked-file-policy.json")
          registry_path = Path("series/registry.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          def identities(field):
              rows = policy.get(field)
              if not isinstance(rows, list) or not rows:
                  raise SystemExit(f"FAIL: {field} must be a nonempty list")
              parsed = set()
              for row in rows:
                  if not isinstance(row, dict) or set(row) != {"name", "email"}:
                      raise SystemExit(f"FAIL: malformed {field} entry: {row!r}")
                  name = row["name"]
                  email = row["email"]
                  if not isinstance(name, str) or not isinstance(email, str) or not name or not email:
                      raise SystemExit(f"FAIL: malformed {field} identity: {row!r}")
                  parsed.add((name, email))
              if len(parsed) != len(rows):
                  raise SystemExit(f"FAIL: duplicate identity in {field}")
              return parsed

          allowed_authors = identities("allowed_author_identities")
          allowed_committers = identities("allowed_committer_identities")
          compatibility = identities("allowed_commit_identities")
          github_server = ("GitHub", "noreply@github.com")

          if github_server in allowed_authors:
              raise SystemExit("FAIL: GitHub server identity must never be an allowed author")
          if github_server not in allowed_committers:
              raise SystemExit("FAIL: GitHub server identity must be an allowed committer")
          if compatibility != allowed_authors | allowed_committers:
              raise SystemExit(
                  "FAIL: allowed_commit_identities must equal the compatibility union of "
                  "allowed_author_identities and allowed_committer_identities"
              )

          raw = subprocess.check_output(
              ["git", "log", "HEAD", "--format=%an%x1f%ae%x1f%cn%x1f%ce%x1e"],
              text=True,
          )
          for record in raw.split("\x1e"):
              record = record.strip("\r\n")
              if not record:
                  continue
              fields = record.split("\x1f")
              if len(fields) != 4:
                  raise SystemExit("FAIL: unable to parse a Git author/committer identity")
              author = (fields[0], fields[1])
              committer = (fields[2], fields[3])
              if author not in allowed_authors:
                  raise SystemExit(
                      f"FAIL: disallowed Git author identity: {author[0]} <{author[1]}>"
                  )
              if committer not in allowed_committers:
                  raise SystemExit(
                      f"FAIL: disallowed Git committer identity: {committer[0]} <{committer[1]}>"
                  )

          allowed_missing = policy.get("allowed_missing_canonical_entrypoints")
          if (
              not isinstance(allowed_missing, list)
              or any(not isinstance(value, str) or not value for value in allowed_missing)
              or len(allowed_missing) != len(set(allowed_missing))
          ):
              raise SystemExit(
                  "FAIL: allowed_missing_canonical_entrypoints must be a unique string list"
              )
          allowed_missing_set = set(allowed_missing)
          actual_missing = {
              row.get("series_id")
              for row in registry.get("series", [])
              if isinstance(row, dict)
              and row.get("canonical_entrypoint_status") == "MISSING"
          }
          if None in actual_missing:
              raise SystemExit("FAIL: MISSING series route without series_id")
          if actual_missing != allowed_missing_set:
              raise SystemExit(
                  "FAIL: canonical-entrypoint MISSING set differs from reviewed allowlist; "
                  f"allowed={sorted(allowed_missing_set)}, actual={sorted(actual_missing)}"
              )
          PY
          mkdir -p "${MANGA_ANIME_TEST_TMP}"
          python -m unittest discover -s tools/tests -p "test_*.py"
          # Markdown uses two trailing spaces as an intentional hard line break.
          git show --check --format= "${AUDIT_COMMIT}" -- . \
            ':(top,glob,exclude)**/*.md' \
            ':(top,literal,exclude)series/idoly-pride/V2 Analysis/02 Source Audits and Longitudinal Ledgers/02.01 Corpus Coverage and Priority Ledger/IDOLY_PRIDE_V2_SOURCE_TO_BUNDLE_PROVENANCE.csv'

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "audit-result.json").read_text())
          if result["audited_commit"] != os.environ["AUDIT_COMMIT"]:
              raise SystemExit("FAIL: audit result does not match the selected commit")
          state = result["integration_state"]
          if state not in {"pending", "success"}:
              raise SystemExit("FAIL: invalid audit result state")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"integration_state={state}\n")
          PY

  report:
    name: Report the result on the audited commit
    needs: audit
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish only the exact audit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_sha || github.sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          INTEGRATION_STATE: ${{ needs.audit.outputs.integration_state }}
          ANALYTICAL_SOURCE: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'series/') || startsWith(github.ref_name, 'studies/')) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          sha = os.environ["AUDIT_COMMIT"]
          repository = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("FAIL: invalid audited commit")
          if repository != "deep-blue-zero/anime-manga-ln-games-analysis":
              raise SystemExit("FAIL: unexpected repository")
          result = os.environ["AUDIT_RESULT"]
          integration = os.environ["INTEGRATION_STATE"]
          if result == "success" and integration in {"success", "pending"}:
              state = "pending" if os.environ["ANALYTICAL_SOURCE"] == "true" else integration
              description = (
                  "Exact commit passed the repository audit"
                  if state == "success"
                  else "Authored content passed; awaiting housekeeping and final audit"
              )
          else:
              state = "error" if result in {"cancelled", "skipped"} else "failure"
              description = "Audit did not complete successfully; this commit is not integration-ready"
          payload = json.dumps({
              "state": state,
              "context": "Repository integration audit",
              "description": description,
              "target_url": f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit("FAIL: GitHub did not confirm the commit status")
          print(f"Reported {state} for exact audited commit {sha}")
          PY
