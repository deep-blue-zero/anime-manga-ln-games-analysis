name: Repository audit

on:
  push:
    branches:
      - main
      - character-registry
      - character-reconstruction
      - "codex/**"
      - "chatgpt/**"
      - "claude/**"
      - "agent/**"
      - "series/**"
      - "studies/**"
  repository_dispatch:
    types:
      - audit-generated-commit
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only integrity and publication audit
    outputs:
      integration_state: ${{ steps.validate.outputs.integration_state }}
      tests_run: ${{ steps.summarize.outputs.tests_run }}
      failures: ${{ steps.summarize.outputs.failures }}
      errors: ${{ steps.summarize.outputs.errors }}
      skipped: ${{ steps.summarize.outputs.skipped }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_sha || github.sha }}
      AUDIT_EVENT: ${{ github.event_name }}
      AUDIT_BRANCH: ${{ github.ref_name }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AUDIT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${AUDIT_COMMIT}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${AUDIT_COMMIT}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          # Branch identity comes from the live ref, never a dispatch payload. A
          # missing curation branch (exit 2) is allowed; any other failure stops.
          if git ls-remote --exit-code --heads origin character-registry > /dev/null; then
            git fetch --no-tags origin refs/heads/character-registry:refs/remotes/origin/character-registry
          else
            status=$?
            test "${status}" -eq 2
          fi

      - name: Install hash-locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r tools/requirements-validation.txt

      - name: Validate authored content or the exact integration commit
        id: validate
        shell: bash
        env:
          MANGA_ANIME_TEST_TMP: "${{ runner.temp }}/manga-anime-tests"
        run: |
          set -euo pipefail
          audit_args=(--phase current --snapshot commit --commit "${AUDIT_COMMIT}" --repo . --result-json "${RUNNER_TEMP}/audit-result.json" --timings-json "${RUNNER_TEMP}/audit-timings.json")
          if [[ "${AUDIT_EVENT}" = "push" && "${AUDIT_BRANCH}" =~ ^(series|studies)/[a-z0-9][a-z0-9-]*$ ]]; then
            audit_args+=(--routing-preflight "${AUDIT_BRANCH}")
          fi
          if [[ "${AUDIT_BRANCH}" = "character-registry" && "${AUDIT_EVENT}" != "repository_dispatch" ]]; then
            audit_args+=(--discovery-branch-confinement)
          fi
          python tools/validate_repository.py "${audit_args[@]}"
          mkdir -p "${MANGA_ANIME_TEST_TMP}"
          python tools/audit_execution.py --snapshot commit --commit "${AUDIT_COMMIT}" --report-json "${RUNNER_TEMP}/test-timings.json"
          # Markdown uses two trailing spaces as an intentional hard line break.
          git show --check --format= "${AUDIT_COMMIT}" -- . \
            ':(top,glob,exclude)**/*.md' \
            ':(top,literal,exclude)series/idoly-pride/V2 Analysis/02 Source Audits and Longitudinal Ledgers/02.01 Corpus Coverage and Priority Ledger/IDOLY_PRIDE_V2_SOURCE_TO_BUNDLE_PROVENANCE.csv'

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "audit-result.json").read_text())
          if result["audited_commit"] != os.environ["AUDIT_COMMIT"]:
              raise SystemExit("FAIL: audit result does not match the selected commit")
          state = result["integration_state"]
          if state not in {"pending", "success"}:
              raise SystemExit("FAIL: invalid audit result state")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"integration_state={state}\n")
          PY

      - name: Summarize audit execution
        id: summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = ["### Audit execution", "", "All discovered regression tests remain mandatory.", ""]
          count_fields = ("tests_run", "failures", "errors", "skipped")
          summary_count_fields = (*count_fields, "expected_failures", "unexpected_successes")
          counts = {}
          for filename, label in (("audit-timings.json", "Archive validation"), ("test-timings.json", "Regression execution")):
              path = Path(os.environ["RUNNER_TEMP"]) / filename
              if not path.exists():
                  lines.append(f"- {label}: no completed report; inspect earlier steps.")
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              valid_counts = {
                  key: report[key] for key in summary_count_fields
                  if type(report.get(key)) is int and report[key] >= 0
              }
              compact = {"outcome": report["outcome"], "seconds": report["seconds"], **valid_counts}
              prefix = f"AUDIT_EXECUTION_SUMMARY: {filename} "
              line = prefix + json.dumps(compact, sort_keys=True)
              print(line if len(line) <= 300 else prefix + '{"summary": "too large"}')
              lines.append(f"- {label}: {report['outcome']}, {report['seconds']:.2f} seconds.")
              if filename == "test-timings.json":
                  counts = {key: valid_counts[key] for key in count_fields if key in valid_counts}
                  if "tests_run" in counts and "skipped" in counts:
                      lines.append(f"- Tests executed: {counts['tests_run']}; skipped: {counts['skipped']}.")
              rendered = json.dumps(report, sort_keys=True, indent=2)
              lines.extend([
                  "", f"<details><summary>{label} report ({filename}, {len(rendered.encode('utf-8'))} bytes)</summary>",
                  "", "```json", rendered, "```", "", "</details>", "",
              ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          if counts and os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in counts.items():
                      output.write(f"{key}={value}\n")
          PY

  report:
    name: Report the result on the audited commit
    needs: audit
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish only the exact audit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_COMMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_sha || github.sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          INTEGRATION_STATE: ${{ needs.audit.outputs.integration_state }}
          AUDIT_TESTS_RUN: ${{ needs.audit.outputs.tests_run }}
          AUDIT_FAILURES: ${{ needs.audit.outputs.failures }}
          AUDIT_ERRORS: ${{ needs.audit.outputs.errors }}
          AUDIT_SKIPPED: ${{ needs.audit.outputs.skipped }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          sha = os.environ["AUDIT_COMMIT"]
          repository = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("FAIL: invalid audited commit")
          if repository != "deep-blue-zero/anime-manga-ln-games-analysis":
              raise SystemExit("FAIL: unexpected repository")
          result = os.environ["AUDIT_RESULT"]
          integration = os.environ["INTEGRATION_STATE"]
          if result == "success" and integration in {"success", "pending"}:
              state = integration
              counts = {key: os.environ.get(f"AUDIT_{key.upper()}", "") for key in ("tests_run", "failures", "errors", "skipped")}
              unavailable = "test counts unavailable"
              summary = unavailable
              if all(re.fullmatch(r"[0-9]+", value) for value in counts.values()):
                  summary = f"{counts['tests_run']} tests, {counts['failures']} failed, {counts['errors']} errors, {counts['skipped']} skipped"
              template = (
                  "Exact commit passed the repository audit: {}"
                  if state == "success"
                  else "Authored content passed ({}); awaiting housekeeping to regenerate routing outputs"
              )
              description = template.format(summary)
              if len(description) > 140:
                  description = template.format(unavailable)
          else:
              state = "error" if result in {"cancelled", "skipped"} else "failure"
              description = "Audit did not complete successfully; this commit is not integration-ready"
          payload = json.dumps({
              "state": state,
              "context": "Repository integration audit",
              "description": description,
              "target_url": f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit("FAIL: GitHub did not confirm the commit status")
          print(f"Reported {state} for exact audited commit {sha}")
          PY
