name: Repository audit

on:
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only integrity and publication audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Install hash-locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r tools/requirements-validation.txt

      - name: Validate the exact commit
        shell: bash
        env:
          MANGA_ANIME_TEST_TMP: "${{ runner.temp }}/manga-anime-tests"
        run: |
          set -euo pipefail
          python tools/validate_repository.py --phase current --snapshot commit --commit "${GITHUB_SHA}" --repo .
          python tools/generate_character_index.py --check --snapshot commit --commit "${GITHUB_SHA}" --repo .
          mkdir -p "${MANGA_ANIME_TEST_TMP}"
          python -m unittest discover -s tools/tests -p "test_*.py"
          # Markdown uses two trailing spaces as an intentional hard line break.
          git show --check --format= "${GITHUB_SHA}" -- . \
            ':(top,glob,exclude)**/*.md' \
            ':(top,literal,exclude)series/idoly-pride/V2 Analysis/02 Source Audits and Longitudinal Ledgers/02.01 Corpus Coverage and Priority Ledger/IDOLY_PRIDE_V2_SOURCE_TO_BUNDLE_PROVENANCE.csv'
