name: Global index housekeeping

on:
  workflow_run:
    workflows:
      - Repository audit
    types:
      - completed
    branches:
      - "series/**"
      - "studies/**"

permissions:
  contents: write

concurrency:
  group: global-index-housekeeping-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize allowlisted global surfaces
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      (startsWith(github.event.workflow_run.head_branch, 'series/') ||
      startsWith(github.event.workflow_run.head_branch, 'studies/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Acquire and constrain the exact analytical branch
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          echo "ready=false" >> "${GITHUB_OUTPUT}"
          if [[ ! "${BRANCH_NAME}" =~ ^(series|studies)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "FAIL: branch is outside the stable analytical branch contract" >&2
            exit 1
          fi
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          if [[ "$(git rev-parse "origin/${BRANCH_NAME}")" != "${SOURCE_SHA}" ]]; then
            echo "::notice::Superseded housekeeping run; the newer branch head needs its own audit."
            exit 0
          fi
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git checkout --detach "${SOURCE_SHA}"
          # The source audit already confined the branch to its root, the five
          # routing outputs and the two discovery outputs.
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Install hash-locked validation dependencies
        if: steps.acquire.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r tools/requirements-validation.txt

      - name: Generate, validate, and publish allowlisted outputs
        if: steps.acquire.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dispatch_exact_audit() {
            local generated_sha="$1"
          python - "${generated_sha}" "${BRANCH_NAME}" > dispatch.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "event_type": "audit-generated-commit",
              "client_payload": {"commit_sha": sys.argv[1], "branch": sys.argv[2]},
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @dispatch.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"
          echo "PASS: dispatched the full audit for ${generated_sha}"
          }
          readonly generated_paths=(
            "governance/MANGA_ANIME_CORPUS_INDEX.md"
            "series/README.md"
            "series/registry.json"
            "studies/README.md"
            "studies/registry.json"
          )
          python tools/synchronize_global_registries.py --branch "${BRANCH_NAME}" --write
          git add -- "series/registry.json" "studies/registry.json"
          python tools/update_repository_indexes.py --snapshot index --write
          git add -- "series/README.md" "studies/README.md" "governance/MANGA_ANIME_CORPUS_INDEX.md"
          python - "${generated_paths[@]}" <<'PY'
          import subprocess
          import sys

          allowed = set(sys.argv[1:])
          changed = {
              raw.decode("utf-8", "strict")
              for raw in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only", "-z", "HEAD", "--"]
              ).split(b"\0")
              if raw
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"FAIL: automation staged a prohibited path: {unexpected}")
          PY
          if git diff --cached --quiet HEAD --; then
            echo "PASS: routing outputs are current; the source audit already reported this exact head"
            exit 0
          fi
          # Routing outputs list every root, so they are regenerated only on a branch that contains current main.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "FAIL: incorporate current main before housekeeping can regenerate routing outputs" >&2
            exit 1
          fi
          python tools/prepare_commit.py --base origin/main --check --full
          export GIT_AUTHOR_NAME="deep-blue-zero"
          export GIT_AUTHOR_EMAIL="50891441+peipw@users.noreply.github.com"
          export GIT_COMMITTER_NAME="GitHub"
          export GIT_COMMITTER_EMAIL="noreply@github.com"
          git commit -m "chore: synchronize global repository indexes" \
            -m "Generated-From: ${SOURCE_SHA}"
          generated_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          if [[ "${remote_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::notice::Superseded before publication; no generated changes were pushed."
            exit 0
          fi
          remote_main="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          if [[ "${remote_main}" != "$(git rev-parse origin/main)" ]]; then
            echo "::notice::Main advanced during housekeeping; reconcile and audit the branch again."
            exit 0
          fi
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          if ! git push origin "HEAD:refs/heads/${BRANCH_NAME}"; then
            observed="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
            if [[ "${observed}" = "${generated_sha}" ]]; then
              echo "::notice::The push response was ambiguous; the exact generated commit is present."
            elif [[ -n "${observed}" && "${observed}" != "${SOURCE_SHA}" ]]; then
              echo "::notice::Superseded during publication; preserve the newer branch head."
              exit 0
            else
              echo "FAIL: generated commit was not published" >&2
              exit 1
            fi
          fi
          dispatch_exact_audit "${generated_sha}"
